name: PR Tests
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '25.6.1'

      - name: Install dependencies
        run: npm install

      - name: Run lint checks
        run: npm run lint
        
      - name: Run type checks
        run: npm run typecheck

      - name: Run tests
        run: npm test